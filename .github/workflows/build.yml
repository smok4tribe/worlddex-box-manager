name: Verify Box Manager

on:
  workflow_dispatch:
  push:
    paths:
      - "box-manager.js"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Box Manager v1.17.1
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="239060910a15e73963ca0e78408d5d4e29344c54f6b06ef313e9d2c08515a313"

          node --check box-manager.js

          ACTUAL="$(sha256sum box-manager.js | awk '{print $1}')"
          echo "SHA256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
