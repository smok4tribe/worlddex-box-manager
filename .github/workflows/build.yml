name: Verify Box Manager

on:
  workflow_dispatch:
  push:
    paths:
      - "box-manager.js"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify standalone source
        shell: bash
        run: |
          node --check box-manager.js
          ACTUAL="$(sha256sum box-manager.js | awk '{print $1}')"
          EXPECTED="67f9d7288b3042d30db529b716970c77c773e94e52da84fba5f2dc10f932aab7"
          echo "SHA256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
