name: Build Box Manager

on:
  workflow_dispatch:
  push:
    paths:
      - "payload/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild standalone source
        shell: bash
        run: |
          cat payload/part-*.b64 > /tmp/box-manager.b64
          base64 -d /tmp/box-manager.b64 | gzip -d > box-manager.js
          node --check box-manager.js
          ACTUAL="$(sha256sum box-manager.js | awk '{print $1}')"
          EXPECTED="67f9d7288b3042d30db529b716970c77c773e94e52da84fba5f2dc10f932aab7"
          echo "SHA256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Commit generated build
        shell: bash
        run: |
          if ! git status --porcelain -- box-manager.js | grep -q .; then
            echo "box-manager.js already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add box-manager.js
          git commit -m "Build Box Manager v1.11.1"
          git push

# Payload uploaded in six chunks; checksum above guards reconstruction.
