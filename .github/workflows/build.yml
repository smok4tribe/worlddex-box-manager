name: Verify Box Manager

on:
  workflow_dispatch:
  push:
    paths:
      - "box-manager.js"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Box Manager v1.15.1
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="91d124c9c3129ead0b84f2d4c511ba1baefe115696fc7124ca677fe19f114dc1"

          node --check box-manager.js

          ACTUAL="$(sha256sum box-manager.js | awk '{print $1}')"
          echo "SHA256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
