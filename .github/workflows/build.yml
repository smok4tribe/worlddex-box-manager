name: Verify Box Manager

on:
  workflow_dispatch:
  push:
    paths:
      - "box-manager.js"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Box Manager v1.15
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="73b1ebb970ae70fe19d2bdab85b95f51b4430cd204a204cc5b9577ce405c8aae"

          node --check box-manager.js

          ACTUAL="$(sha256sum box-manager.js | awk '{print $1}')"
          echo "SHA256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
