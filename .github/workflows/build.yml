name: Apply Box Manager v1.17.1

on:
  push:
    paths:
      - ".tmp-v1171/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified v1.17.1 patch
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f .tmp-v1171/part01.b64 ]; then
            echo "No staging payload present; nothing to apply."
            exit 0
          fi

          OLD="91d124c9c3129ead0b84f2d4c511ba1baefe115696fc7124ca677fe19f114dc1"
          NEW="239060910a15e73963ca0e78408d5d4e29344c54f6b06ef313e9d2c08515a313"
          PATCH_XZ="2e989968181bffe48d0ee6d357ae417e4eb2b97bc7f69108bd2280899cf5cc7c"

          test "$(sha256sum box-manager.js | awk '{print $1}')" = "$OLD"

          cat .tmp-v1171/part*.b64 | base64 -d > /tmp/v1171.patch.xz
          test "$(sha256sum /tmp/v1171.patch.xz | awk '{print $1}')" = "$PATCH_XZ"
          xz -dc /tmp/v1171.patch.xz > /tmp/v1171.patch
          patch box-manager.js < /tmp/v1171.patch

          node --check box-manager.js
          ACTUAL="$(sha256sum box-manager.js | awk '{print $1}')"
          echo "SHA256: $ACTUAL"
          test "$ACTUAL" = "$NEW"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add box-manager.js
          git rm -r .tmp-v1171
          git commit -m "Release Box Manager v1.17.1"
          git push origin HEAD:main
