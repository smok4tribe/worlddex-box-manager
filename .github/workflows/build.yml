name: Verify Box Manager

on:
  workflow_dispatch:
  push:
    paths:
      - "box-manager.js"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Box Manager v1.18.2
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="e84a1bd7153f23c1074e7a0360a3df7dba39e22937cc44470e5722b4932b24c8"

          node --check box-manager.js

          ACTUAL="$(sha256sum box-manager.js | awk '{print $1}')"
          echo "SHA256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
