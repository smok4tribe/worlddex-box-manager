name: Verify Box Manager

on:
  workflow_dispatch:
  push:
    paths:
      - "box-manager.js"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Box Manager v1.18.3
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="5a42af9ddc512438b6d584ba382d21a6591addc9af7ad96dd297bd3d50502288"

          node --check box-manager.js

          ACTUAL="$(sha256sum box-manager.js | awk '{print $1}')"
          echo "SHA256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
