name: Apply Box Manager v1.18.6 test

on:
  push:
    branches:
      - box-v1-18-6-regional-dex
    paths:
      - ".github/patch_v1186.py"
      - ".github/retrigger-v1186.txt"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: box-v1-18-6-regional-dex
          fetch-depth: 0

      - name: Apply reviewed v1.18.6 patch
        run: python .github/patch_v1186.py

      - name: Add resilient labels for confirmed regional evolution items
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('box-manager.js')
          text = p.read_text(encoding='utf-8')
          fn_anchor = "      function evolutionItemLabel(item) {"
          return_anchor = "        return String(ITEM_DB?.[id]?.n || titleCaseSlug(id));"
          if text.count(fn_anchor) != 1:
              raise SystemExit(f'item-label function anchor mismatch: {text.count(fn_anchor)}')
          if text.count(return_anchor) != 1:
              raise SystemExit(f'item-label return anchor mismatch: {text.count(return_anchor)}')
          labels = """      const REGIONAL_EVOLUTION_ITEM_LABELS = {
        'island-shard':'Island Shard',
        'ancient-shard':'Ancient Shard',
        'galarica-cuff':'Galarica Cuff',
        'galarica-wreath':'Galarica Wreath'
      };

"""
          text = text.replace(fn_anchor, labels + fn_anchor, 1)
          text = text.replace(
              return_anchor,
              "        return String(ITEM_DB?.[id]?.n || REGIONAL_EVOLUTION_ITEM_LABELS[id] || titleCaseSlug(id));",
              1
          )
          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate complete JavaScript and safety markers
        shell: bash
        run: |
          set -euo pipefail
          node --check box-manager.js
          grep -Fq "BOX MANAGER v1.18.6" box-manager.js
          grep -Fq "NO AUTOMATIC RELEASES — release only from review panel after double confirmation" box-manager.js
          grep -Fq "doneMarketHardIVPct: 90" box-manager.js
          grep -Fq "protectFourPerfectIVsHard: true" box-manager.js
          grep -Fq "const REGION_ONLY" box-manager.js
          grep -Fq "island-shard" box-manager.js
          grep -Fq "ancient-shard" box-manager.js
          grep -Fq "galarica-cuff" box-manager.js
          grep -Fq "Living Dex protected" box-manager.js
          grep -Fq "Alola region" box-manager.js

      - name: Commit only intended test files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "smok4tribe"
          git config user.email "57266150+smok4tribe@users.noreply.github.com"
          git rm -f .github/patch_v1186.py .github/workflows/apply-v1186-test.yml .github/retrigger-v1186.txt
          git add box-manager.js README.md CHANGELOG.md .github/workflows/build.yml
          git diff --cached --check
          git commit -m "Worlddex Box Manager v1.18.6 test: regional Dex tasks"
          git push origin HEAD:box-v1-18-6-regional-dex
