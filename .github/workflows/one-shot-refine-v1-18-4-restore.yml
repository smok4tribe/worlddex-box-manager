name: Refine Box Manager v1.18.4 restore position

on:
  push:
    branches:
      - box-manager-v1-18-4-shell
    paths:
      - .github/workflows/one-shot-refine-v1-18-4-restore.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: box-manager-v1-18-4-shell
      - name: Apply restore clamp
        run: python3 .github/scripts/refine_v1_18_4_restore_position.py
      - name: Validate JavaScript
        run: |
          node --check box-manager.js
          grep -Fq 'Clamp the restored shell back into the viewport' box-manager.js
      - name: Commit refinement
        run: |
          rm .github/workflows/one-shot-refine-v1-18-4-restore.yml
          rm .github/scripts/refine_v1_18_4_restore_position.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep restored Box Manager on-screen"
          git push origin HEAD:box-manager-v1-18-4-shell
